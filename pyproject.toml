[project]
name = "gdsx"
version = "0.1.0"
description = "GDS Extractor"
readme = "README.md"
authors = [
    { name = "Satya Jhaveri", email = "satyajhaveri@protonmail.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.27.1",
    "rich",
]
native = [
    "klayout>=0.30.10",
]

[project.scripts]
gdsx = "gdsx.cli:main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "gdsx[cli,native]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: exhaustive sweeps"]
