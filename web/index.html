<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/vite.svg" />
    <title>gdsx / die view</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0f14;
        color: #cfd4de;
        overflow: hidden;
      }
      #workspace {
        position: absolute;
        inset: 0;
      }

      /* ---- app toolbar: reset layout, reopen closed tabs --------------- */
      .gdsx-toolbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 28px;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px;
        background: #10131a;
        border-bottom: 1px solid #262b36;
        box-sizing: border-box;
      }
      .gdsx-toolbar-title {
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #7d8598;
        font-size: 11px;
      }
      .gdsx-toolbar-spacer {
        flex: 1;
      }
      .gdsx-level-select {
        background: #1a1f2b;
        color: #cfd4de;
        border: 1px solid #2e3444;
        border-radius: 3px;
        padding: 2px 4px;
        font: inherit;
        max-width: 240px;
        cursor: pointer;
      }
      .gdsx-level-select:hover:not(:disabled) {
        border-color: #4a536b;
      }
      .gdsx-level-select:disabled {
        opacity: 0.5;
        cursor: progress;
      }
      .gdsx-toolbar-status {
        color: #9aa2b5;
        font-size: 11px;
        white-space: nowrap;
        flex: none;
      }
      /* The objective. `min-width: 0` plus the blurb's own ellipsis is what
         lets the sentence give up room first while the goal phrase -- the half
         that actually says what ends the puzzle -- always survives. */
      .gdsx-objective {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
        font-size: 11px;
        cursor: default;
      }
      .gdsx-objective-goal {
        flex: none;
        color: #f2cc4d;
        border: 1px solid #5a4d1f;
        border-radius: 3px;
        padding: 0 5px;
        white-space: nowrap;
      }
      .gdsx-objective-blurb {
        color: #7d8598;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .gdsx-toolbar button {
        background: #1a1f2b;
        color: #cfd4de;
        border: 1px solid #2e3444;
        border-radius: 3px;
        padding: 3px 8px;
        font: inherit;
        cursor: pointer;
        /* The objective beside the level picker is elastic; these are not.
           Without this the buttons wrap to two lines inside a 28px bar. */
        flex: none;
        white-space: nowrap;
      }
      .gdsx-toolbar button:hover:not(:disabled) {
        border-color: #4a536b;
      }
      .gdsx-toolbar button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .gdsx-reopen-wrap {
        position: relative;
      }
      .gdsx-reopen-menu {
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 4px;
        min-width: 160px;
        background: #10131a;
        border: 1px solid #2e3444;
        border-radius: 4px;
        overflow: hidden;
        z-index: 31;
      }
      .gdsx-reopen-item {
        padding: 5px 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      .gdsx-reopen-item:hover {
        background: #1c2130;
        color: #f2cc4d;
      }
      .gdsx-dock-mount {
        position: absolute;
        top: 28px;
        left: 0;
        right: 0;
        bottom: 0;
      }

      /* ---- dockview panel chrome ------------------------------------- */
      .gdsx-panel {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0f14;
      }

      /* ---- sub-tab host (panels/mounts.ts) ----------------------------- */
      /* One panel, several former panels beneath it. Visually quieter than
         dockview's own tab strip on purpose: this is a division *within* a
         tab, and making it look like a peer of the tab strip above would read
         as two competing rows of tabs. */
      .pt-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .pt-tabs {
        display: flex;
        gap: 2px;
        flex: none;
        padding: 4px 6px 0;
        border-bottom: 1px solid #1c2130;
      }
      .pt-tab {
        background: transparent;
        border: 1px solid transparent;
        border-bottom: 0;
        border-radius: 3px 3px 0 0;
        padding: 3px 12px;
        color: #7d8598;
        cursor: pointer;
      }
      .pt-tab:hover {
        color: #cfd4de;
      }
      .pt-tab.on {
        background: #0d0f14;
        border-color: #262b36;
        color: #f2cc4d;
      }
      .pt-host {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      /* One per section, so a kept-alive section can be hidden without the
         next one having to clear up after it. */
      .pt-section {
        position: absolute;
        inset: 0;
      }
      .pt-section[hidden] {
        display: none;
      }

      /* ---- collapsible drawer (panels/mounts.ts) ----------------------- */
      .pd-drawer {
        flex: none;
        border-top: 1px solid #262b36;
        background: #0d0f14;
      }
      .pd-drawer-head {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        background: transparent;
        border: 0;
        border-radius: 0;
        padding: 5px 8px;
        text-align: left;
        color: #7d8598;
        cursor: pointer;
      }
      .pd-drawer-head:hover {
        color: #cfd4de;
        background: #121722;
      }
      .pd-drawer.on .pd-drawer-title {
        color: #cfd4de;
      }
      .pd-drawer-caret {
        width: 10px;
        flex: none;
      }
      .pd-drawer-badge {
        margin-left: auto;
        font-size: 10px;
        color: #f2cc4d;
        border: 1px solid #5a4d1f;
        border-radius: 3px;
        padding: 0 5px;
      }
      .pd-drawer-badge:empty {
        display: none;
      }
      .pd-drawer-body {
        max-height: 45vh;
        overflow-y: auto;
        border-top: 1px solid #1c2130;
      }

      /* ---- die view panel: 2D/3D toggle + debug switch ----------------- */
      .die-modebar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 26px;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px;
        box-sizing: border-box;
        background: #10131a;
        border-bottom: 1px solid #262b36;
      }
      .die-modebar-spacer {
        flex: 1;
      }
      .die-mode-seg {
        display: flex;
      }
      .die-mode-seg button {
        border-radius: 0;
        padding: 2px 12px;
        color: #7d8598;
      }
      .die-mode-seg button:first-child {
        border-radius: 3px 0 0 3px;
      }
      .die-mode-seg button:last-child {
        border-radius: 0 3px 3px 0;
        border-left: 0;
      }
      .die-mode-seg button.on {
        background: #2a3346;
        color: #cfd4de;
      }
      .die-debug-toggle {
        display: flex;
        align-items: center;
        gap: 5px;
        color: #6d7486;
        cursor: pointer;
      }
      .die-mode-host {
        position: absolute;
        top: 26px;
        left: 0;
        right: 0;
        bottom: 0;
      }
      /* Diagnostics are hidden unless the player asks for them. */
      .die-stats,
      .die3d-stats {
        display: none;
      }
      .die-debug-on .die-stats,
      .die-debug-on .die3d-stats {
        display: block;
      }

      /* ---- die view, 2D ------------------------------------------------ */
      .die-canvas-wrap {
        position: absolute;
        inset: 0;
      }
      .die-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      .die-canvas:active {
        cursor: grabbing;
      }
      .die-loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6d7486;
      }
      .die-minimap {
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 200px;
        height: 140px;
        border: 1px solid #262b36;
        border-radius: 4px;
        cursor: crosshair;
      }

      .panel-overlay {
        position: absolute;
        background: rgba(16, 19, 26, 0.88);
        border: 1px solid #262b36;
        border-radius: 4px;
        padding: 8px 10px;
      }
      .die-layers {
        top: 10px;
        left: 10px;
        min-width: 130px;
      }
      .die-stats {
        top: 10px;
        right: 10px;
        white-space: pre;
        line-height: 1.5;
        margin: 0;
      }
      .die-layers label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 1px 0;
        cursor: pointer;
      }
      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        display: inline-block;
      }
      .panel-overlay h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #7d8598;
        margin: 0 0 6px;
        font-weight: 600;
      }
      .panel-overlay hr {
        border: 0;
        border-top: 1px solid #262b36;
        margin: 8px 0 6px;
      }
      .panel-overlay select {
        background: #10131a;
        color: #cfd4de;
        border: 1px solid #262b36;
        font: inherit;
        width: 100%;
      }
      .panel-overlay .hint {
        color: #6d7486;
      }

      /* ---- die view, 3D (§4.2) ----------------------------------------- */
      .die3d-wrap {
        position: absolute;
        inset: 0;
      }
      .die3d-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      .die3d-canvas:active {
        cursor: grabbing;
      }
      .die3d-loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        text-align: center;
        color: #6d7486;
      }
      .die3d-layers {
        top: 10px;
        left: 10px;
        min-width: 150px;
      }
      .die3d-layers label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 1px 0;
        cursor: pointer;
      }
      .die3d-layers input[type="range"] {
        width: 100%;
      }
      .die3d-section-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        cursor: pointer;
      }
      .die3d-trace,
      .die3d-fit {
        width: 100%;
        margin-top: 6px;
      }
      .die3d-stats {
        top: 10px;
        right: 10px;
        white-space: pre;
        line-height: 1.5;
        margin: 0;
      }
      .die3d-trace-status {
        left: 10px;
        bottom: 10px;
        color: #f2cc4d;
      }

      /* ---- shared bits: toolbar controls, net chips, { } button -------- */
      input[type="text"],
      select,
      button {
        font: inherit;
        color: #cfd4de;
      }
      button {
        background: #1a1f2b;
        border: 1px solid #2e3444;
        border-radius: 3px;
        padding: 3px 8px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: #4a536b;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.active {
        background: #2a3547;
        border-color: #4d6a9e;
        color: #cfe0ff;
      }
      input[type="text"] {
        background: #10131a;
        border: 1px solid #262b36;
        border-radius: 3px;
        padding: 4px 6px;
      }
      select {
        background: #10131a;
        border: 1px solid #262b36;
        border-radius: 3px;
        padding: 3px 4px;
      }

      .net-chip {
        color: #8ecdf7;
        cursor: pointer;
        border-bottom: 1px dotted transparent;
      }
      .net-chip:hover {
        border-bottom-color: #8ecdf7;
      }
      /* A player-given name reads as one: italic and warmer than the
         extracted names around it, so you can always tell at a glance which
         names came out of the layout and which you made up. */
      .net-chip-labelled {
        color: #f2cc4d;
        font-style: italic;
      }
      .net-chip-labelled:hover {
        border-bottom-color: #f2cc4d;
      }

      /* ---- the label editor popover (chips.ts) ------------------------- */
      .label-editor {
        position: fixed;
        z-index: 60;
        width: 260px;
        padding: 8px;
        background: #10131a;
        border: 1px solid #3a4258;
        border-radius: 4px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
      }
      .label-editor-head {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-bottom: 6px;
      }
      .label-editor-kind {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #7d8598;
      }
      .label-editor-name {
        color: #8ecdf7;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .label-editor-input {
        width: 100%;
        box-sizing: border-box;
        background: #0d0f14;
        border: 1px solid #2e3444;
        border-radius: 3px;
        padding: 4px 6px;
      }
      .label-editor-input:focus {
        outline: none;
        border-color: #4a536b;
      }
      .label-editor-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
      }
      .label-editor-hint {
        margin-left: auto;
        color: #6d7486;
        font-size: 10px;
      }

      .py-call-slot {
        position: relative;
        margin-left: auto;
      }
      .py-call-btn {
        font-weight: 600;
      }
      .py-call-popover {
        position: absolute;
        top: 100%;
        right: 0;
        z-index: 20;
        margin-top: 4px;
        width: min(480px, 60vw);
        background: #0d0f14;
        border: 1px solid #2e3444;
        border-radius: 4px;
        padding: 8px;
      }
      .py-call-popover pre {
        margin: 0 0 6px;
        white-space: pre-wrap;
        word-break: break-word;
        color: #9fe39f;
      }

      /* ---- virtualised list --------------------------------------------- */
      .vlist {
        position: relative;
        overflow-y: auto;
        height: 100%;
      }
      .vlist-sizer {
        position: relative;
      }
      .vlist-rows {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
      }

      /* ---- netlist browser ----------------------------------------------- */
      .netlist-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .netlist-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 8px;
        border-bottom: 1px solid #1c2130;
        flex-wrap: wrap;
      }
      .netlist-tabs {
        display: flex;
        gap: 4px;
      }
      .netlist-check {
        display: flex;
        align-items: center;
        gap: 4px;
        color: #9aa2b5;
      }
      .netlist-count {
        color: #6d7486;
      }
      .netlist-loading {
        padding: 16px;
        color: #6d7486;
      }
      .netlist-body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .netlist-list-instances,
      .netlist-list-nets {
        flex: 1;
        min-width: 0;
        border-right: 1px solid #1c2130;
      }
      .netlist-detail {
        width: 260px;
        flex: none;
        overflow-y: auto;
        padding: 10px;
        box-sizing: border-box;
      }
      .netlist-detail-empty {
        color: #6d7486;
      }
      .nrow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
      }
      .nrow:hover {
        background: #171b26;
      }
      .nrow.active {
        background: #202a3d;
      }
      .nrow-name {
        color: #cfd4de;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nrow-label {
        color: #f2cc4d;
        font-style: italic;
      }
      /* The extracted name, kept beside the player's: a labelled row must
         still be scannable for `n2951`. */
      .nrow-rawname {
        color: #6d7486;
        margin-left: 6px;
      }
      .nrow-badge {
        color: #7d8598;
        font-size: 11px;
      }
      .nrow-seq {
        color: #f2cc4d;
        font-size: 10px;
        border: 1px solid #5a4d1f;
        border-radius: 3px;
        padding: 0 3px;
      }
      .nrow-port {
        color: #66e6e6;
        font-size: 10px;
        border: 1px solid #245a5a;
        border-radius: 3px;
        padding: 0 3px;
      }
      .detail-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 6px;
      }
      .detail-title h3 {
        margin: 0;
      }
      .detail-rawname {
        color: #6d7486;
      }
      .detail-label-btn {
        margin-left: auto;
        flex: none;
        padding: 1px 6px;
        font-size: 11px;
      }
      .detail-box h3 {
        margin: 0 0 6px;
        font-size: 12px;
        word-break: break-all;
      }
      .detail-box h4 {
        margin: 10px 0 4px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #7d8598;
      }
      .detail-meta {
        color: #9aa2b5;
        line-height: 1.6;
      }
      .detail-fn {
        color: #9fe39f;
        word-break: break-all;
      }
      .detail-conn-row {
        display: flex;
        gap: 6px;
        padding: 1px 0;
      }
      .detail-pin {
        color: #7d8598;
        min-width: 28px;
      }
      .detail-open-cone {
        margin-top: 8px;
        width: 100%;
      }

      /* ---- cone walker ---------------------------------------------------- */
      .cone-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .cw-toolbar,
      .cw-flatten-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #1c2130;
        flex-wrap: wrap;
      }
      .cw-net-input {
        flex: 1;
        min-width: 120px;
      }
      .cw-direction {
        display: flex;
        gap: 4px;
      }
      .cw-focus {
        color: #9aa2b5;
      }
      .cw-focus-net {
        color: #f2cc4d;
      }
      .cw-value-toggle {
        display: flex;
        gap: 4px;
      }
      .cw-loading {
        padding: 16px;
        color: #6d7486;
      }
      .cw-body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .cw-tree {
        flex: 1;
        overflow: auto;
        padding: 6px 4px;
      }
      .cw-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 4px;
        border-radius: 3px;
        white-space: nowrap;
      }
      .cw-row:hover {
        background: #171b26;
      }
      .cw-expander {
        width: 18px;
        height: 18px;
        padding: 0;
        line-height: 1;
        flex: none;
      }
      .cw-expander-none {
        border-color: transparent;
        background: transparent;
        cursor: default;
      }
      .cw-truncated {
        color: #f2a65a;
        border-color: #5a3f24;
      }
      .cw-truncated-label {
        color: #f2a65a;
        font-size: 11px;
      }
      .cw-cell {
        color: #7d8598;
        font-size: 11px;
      }
      .cw-fn {
        color: #9fe39f;
        font-size: 11px;
      }
      .cw-pins {
        display: inline-flex;
        gap: 6px;
        margin-left: 6px;
      }
      .cw-pin-label {
        color: #5b6274;
        font-size: 10px;
      }
      .cw-cycle-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #cfe0ff;
        background: #1c2740;
        border: 1px solid #2f4166;
        border-radius: 3px;
        font-size: 10px;
        padding: 0 4px;
      }
      .cw-cycle-t {
        color: #cfe0ff;
      }
      .cw-leaf {
        font-size: 10px;
        border-radius: 3px;
        padding: 0 4px;
      }
      .cw-leaf-primary_in {
        color: #8ecdf7;
        border: 1px solid #24405a;
      }
      .cw-leaf-const0,
      .cw-leaf-const1 {
        color: #9aa2b5;
        border: 1px solid #2e3444;
      }
      .cw-leaf-flop_q {
        color: #f2cc4d;
        border: 1px solid #5a4d1f;
      }
      .cw-leaf-undriven {
        color: #f2735a;
        border: 1px solid #5a2e24;
      }
      .cw-step-btn {
        font-size: 11px;
        padding: 1px 6px;
      }
      .cw-step-error {
        color: #f2735a;
        font-size: 11px;
      }
      .cw-flatten-panel {
        /* Wider than it was: this drawer now carries the whole derivation --
           the forced checklist with its live column and pin buttons, and the
           choices -- rather than a read-only preview of it. */
        width: min(440px, 45%);
        flex: none;
        border-left: 1px solid #1c2130;
        overflow-y: auto;
        padding: 8px 10px;
        box-sizing: border-box;
      }
      .cw-flatten-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .cw-flatten-title {
        color: #f2cc4d;
        word-break: break-all;
      }
      .cw-flatten-close {
        padding: 0 6px;
      }
      .cw-flatten-summary {
        color: #9aa2b5;
        margin-bottom: 8px;
      }
      .cw-flatten-leaves {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .cw-flatten-leaf {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .cw-polarity {
        width: 16px;
        height: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 3px;
        font-size: 10px;
      }
      .cw-polarity-1 {
        background: #1f3a24;
        color: #9fe39f;
      }
      .cw-polarity-0 {
        background: #3a2020;
        color: #f2a5a5;
      }
      .cw-flatten-choices {
        margin-top: 10px;
      }
      .cw-flatten-choices h4 {
        margin: 0 0 6px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #7d8598;
      }
      .cw-choice {
        margin-bottom: 6px;
      }
      .cw-choice-head {
        color: #9aa2b5;
      }
      .cw-choice-option {
        color: #f2a65a;
        padding-left: 10px;
        font-size: 11px;
      }
      .cw-flatten-conflicts {
        margin-top: 10px;
        color: #f2735a;
      }

      /* ---- waveform + sequence editor: shared bits ----------------------- */
      .wave-panel,
      .seq-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .wave-toolbar,
      .seq-toolbar {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #1c2130;
        flex: none;
      }
      .wave-loading,
      .seq-loading {
        padding: 16px;
        color: #6d7486;
      }
      .wave-body,
      .seq-body {
        flex: 1;
        overflow: auto;
        min-height: 0;
      }

      /* ---- waveform -------------------------------------------------------- */
      .wave-search {
        width: 220px;
      }
      .wave-suggest {
        position: absolute;
        top: 100%;
        left: 8px;
        z-index: 20;
        background: #10131a;
        border: 1px solid #2e3444;
        border-radius: 4px;
        max-height: 220px;
        overflow-y: auto;
        min-width: 220px;
      }
      .wave-suggest-item {
        padding: 3px 8px;
        cursor: pointer;
      }
      .wave-suggest-item:hover {
        background: #1c2130;
        color: #f2cc4d;
      }
      .wave-ruler-row {
        display: flex;
        position: sticky;
        top: 0;
        background: #0d0f14;
        z-index: 2;
        border-bottom: 1px solid #1c2130;
      }
      .wave-label-spacer {
        width: 180px;
        flex: none;
      }
      .wave-ruler {
        position: relative;
        height: 16px;
        flex: none;
      }
      .wave-tick {
        position: absolute;
        top: 0;
        color: #5b6274;
        font-size: 9px;
        border-left: 1px solid #262b36;
        padding-left: 2px;
      }
      .wave-row {
        display: flex;
        align-items: center;
        border-bottom: 1px solid #171b26;
      }
      .wave-row-label {
        width: 180px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 4px;
        cursor: grab;
        overflow: hidden;
      }
      .wave-drag-handle {
        color: #4a536b;
        font-size: 10px;
      }
      .wave-row-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .wave-row-name:hover {
        color: #f2cc4d;
      }
      .wave-row-remove {
        padding: 0 5px;
        color: #6d7486;
      }
      .wave-row-canvas {
        display: block;
        flex: none;
        cursor: crosshair;
      }
      .wave-row-radix {
        flex: none;
        background: #10131a;
        color: #8ecdf7;
        border: 1px solid #262b36;
        border-radius: 3px;
        font: inherit;
        font-size: 10px;
        padding: 0 2px;
      }
      .wave-zoom {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-left: auto;
      }
      .wave-zoom button {
        width: 22px;
        padding: 2px 0;
        text-align: center;
      }

      /* ---- sequence editor -------------------------------------------------- */
      .seq-cycles {
        width: 60px;
      }
      .seq-toolbar-sep {
        width: 1px;
        align-self: stretch;
        background: #1c2130;
      }
      .seq-autorun {
        display: flex;
        align-items: center;
        gap: 4px;
        color: #9aa2b5;
        white-space: nowrap;
      }
      .seq-run-btn {
        white-space: nowrap;
      }
      .seq-run-status {
        color: #6d7486;
        white-space: nowrap;
        font-size: 11px;
      }
      .seq-run-status.dirty {
        color: #f2cc4d;
      }
      .seq-result.stale {
        color: #f2a65a !important;
      }
      .seq-result {
        margin-left: auto;
        color: #6d7486;
      }
      .seq-result.latched {
        color: #9fe39f;
      }
      .seq-track {
        border-bottom: 1px solid #171b26;
        padding: 4px 8px;
      }
      .seq-track-header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      .seq-track-name {
        width: 70px;
        flex: none;
        color: #cfd4de;
        font-weight: 600;
      }
      .seq-track-io {
        flex: 1;
        max-width: 340px;
      }
      .seq-track-btn {
        font-size: 11px;
        padding: 1px 6px;
      }
      .seq-ruler {
        position: relative;
        height: 14px;
        margin-left: 0;
      }
      .seq-tick {
        position: absolute;
        top: 0;
        color: #5b6274;
        font-size: 9px;
      }
      .seq-cells {
        position: relative;
        height: 20px;
        touch-action: none;
      }
      .seq-cell {
        position: absolute;
        top: 0;
        background: #171b26;
        border-right: 1px solid #0d0f14;
        box-sizing: border-box;
      }
      .seq-cell.epoch {
        border-right: 1px solid #2e3444;
      }
      .seq-cell.on {
        background: #3a6b3a;
      }
      .seq-cell.cursor {
        outline: 1px solid #f2cc4d;
        outline-offset: -1px;
      }

      /* ---- notebook ------------------------------------------------------- */
      /* The verdict tones are the only place colour carries meaning in this
         panel, and they are deliberately far apart: green and amber must never
         be mistaken for each other at a glance, because that mistake IS reading
         a LIKELY as a PROVEN. */
      .nb-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .nb-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #1c2130;
      }
      .nb-coverage {
        color: #9aa2b5;
      }
      .nb-spacer {
        flex: 1;
      }
      .nb-loading,
      .nb-empty {
        padding: 16px;
        color: #6d7486;
      }
      .nb-list {
        flex: 1;
        overflow: auto;
        padding: 4px;
      }

      .nb-row {
        border: 1px solid #1c2130;
        border-radius: 4px;
        padding: 6px 8px;
        margin-bottom: 6px;
        background: #10131a;
      }
      .nb-row-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .nb-claim-text {
        flex: 1;
        word-break: break-word;
      }
      .nb-struck {
        text-decoration: line-through;
        color: #7d8598;
      }
      .nb-verdict {
        flex: none;
        border-radius: 3px;
        padding: 1px 6px;
        font-size: 11px;
        white-space: nowrap;
      }
      .nb-tone-green {
        background: #16311d;
        border: 1px solid #2f7a45;
        color: #7fd79a;
      }
      .nb-tone-amber {
        background: #33280e;
        border: 1px solid #97741f;
        color: #f2cc4d;
      }
      .nb-tone-red {
        background: #351719;
        border: 1px solid #8c3238;
        color: #f08a90;
      }
      .nb-tone-grey {
        background: #171b26;
        border: 1px solid #2e3444;
        color: #9aa2b5;
      }
      .nb-row-meta {
        display: flex;
        gap: 8px;
        margin-top: 3px;
        color: #6d7486;
        font-size: 11px;
      }
      .nb-points {
        color: #7d8598;
      }
      .nb-note {
        margin-top: 4px;
        padding-left: 8px;
        border-left: 2px solid #2e3444;
        color: #9aa2b5;
        font-size: 11px;
      }
      .nb-detail {
        margin-top: 6px;
        padding: 6px;
        background: #0d0f14;
        border-radius: 3px;
        font-size: 11px;
        color: #9aa2b5;
      }
      .nb-witness {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
      }
      .nb-witness-label {
        color: #6d7486;
      }
      .nb-bit {
        color: #f2cc4d;
      }
      .nb-load {
        margin-top: 6px;
      }
      .nb-actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .nb-history {
        margin-top: 6px;
        font-size: 11px;
        color: #6d7486;
      }
      .nb-history-row {
        padding: 2px 0 2px 10px;
      }

      .nb-form {
        border-bottom: 1px solid #1c2130;
        padding: 8px;
        background: #0d0f14;
      }
      .nb-field {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .nb-label {
        flex: none;
        width: 120px;
        text-align: right;
        color: #9aa2b5;
      }
      .nb-input {
        flex: 1;
        min-width: 80px;
      }
      .nb-wide {
        min-width: 200px;
      }
      .nb-hint {
        margin: 4px 0 8px 128px;
        color: #6d7486;
        font-size: 11px;
      }
      .nb-form-footer {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
      }
      .nb-cost {
        flex: 1;
        font-size: 11px;
      }
      .nb-cost-ok {
        color: #7fd79a;
      }
      /* The warning that has to arrive before the verdict, not after it. */
      .nb-cost-sampled {
        color: #f2cc4d;
      }
      .nb-cost-bad {
        color: #f08a90;
      }
      .nb-cost-idle {
        color: #6d7486;
      }
      .nb-section {
        padding: 8px 6px 4px;
        color: #6d7486;
        border-top: 1px solid #1c2130;
      }
      .nb-evidence {
        padding: 0 4px 8px;
      }
      /* Evidence is a measurement, not an assertion: no verdict tone, and a
         left edge that reads as "recorded" rather than "settled". */
      .nb-evidence-row {
        border-left: 2px solid #3a4256;
      }
      .nb-warning {
        color: #f2cc4d;
        border-left-color: #97741f;
      }
      /* The write-up (game-plan.md §8): editable, so a textarea, not a
         preview -- the player owns this copy the moment it is generated. */
      .nb-writeup {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        border-top: 1px solid #1c2130;
      }
      .nb-writeup-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #1c2130;
      }
      .nb-writeup-hint {
        flex: 1;
        color: #6d7486;
        font-size: 11px;
      }
      .nb-writeup-text {
        flex: 1;
        min-height: 0;
        resize: none;
        border: none;
        background: #10131a;
        color: #d7dbe6;
        font: 12px/1.5 ui-monospace, "SF Mono", monospace;
        padding: 10px;
        box-sizing: border-box;
      }

      /* ---- experiment runner ----------------------------------------------- */
      .xp-panel,
      .mb-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .xp-toolbar,
      .mb-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #1c2130;
      }
      .xp-params {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 6px 8px 0;
      }
      .xp-inline {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: #9aa2b5;
      }
      .xp-num {
        width: 64px;
        background: #10131a;
        border: 1px solid #262b36;
        border-radius: 3px;
        color: #cfd4de;
        padding: 3px 4px;
      }
      .xp-watch-list {
        flex: 1;
        min-width: 200px;
      }
      .xp-blurb {
        padding: 4px 8px 6px;
        color: #6d7486;
        font-size: 11px;
      }
      .xp-loading,
      .mb-loading {
        padding: 16px;
        color: #6d7486;
      }
      .xp-body {
        flex: 1;
        overflow: auto;
        padding: 0 8px 8px;
      }
      .xp-status,
      .mb-status {
        color: #9aa2b5;
        font-size: 11px;
      }
      .xp-status.bad,
      .mb-status.bad {
        color: #f08a90;
      }
      /* The two self-checks from the sensitivity map. Amber, above the matrix,
         and never collapsed into a console log: a matrix with either problem
         looks exactly as convincing as one without. */
      .xp-warning {
        margin: 6px 0;
        padding: 4px 8px;
        border-left: 2px solid #97741f;
        background: #1c1710;
        color: #f2cc4d;
        font-size: 11px;
      }
      .xp-baseline-note {
        margin: 6px 0;
        color: #6d7486;
        font-size: 11px;
      }
      .xp-readout {
        padding: 4px 0;
        color: #cfd4de;
        font-size: 11px;
      }
      .xp-canvas-wrap {
        overflow: auto;
        max-height: 45%;
        border: 1px solid #1c2130;
        background: #0d0f14;
      }
      .xp-canvas {
        display: block;
        cursor: crosshair;
      }
      .xp-summary {
        margin-top: 8px;
      }
      .xp-summary-note {
        color: #6d7486;
        font-size: 11px;
      }
      .xp-table-row {
        display: flex;
        gap: 8px;
        padding: 1px 0;
        font-size: 11px;
      }
      .xp-orient {
        color: #7d8598;
      }
      .xp-to-constraints {
        margin-left: auto;
        flex: none;
        padding: 0 6px;
        font-size: 10px;
        color: #7d8598;
      }
      .xp-to-constraints:disabled {
        color: #6fbf73;
        opacity: 1;
      }
      .xp-table-row .net-chip {
        flex: none;
        width: 120px;
      }
      .xp-hits {
        color: #9aa2b5;
        word-break: break-word;
      }
      .xp-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      .xp-evidence-note {
        color: #6d7486;
        font-size: 11px;
      }

      /* ---- model builder ----------------------------------------------------- */
      .mb-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: auto;
        padding: 8px;
        gap: 8px;
      }
      .mb-source {
        min-height: 180px;
        flex: 1 1 auto;
        resize: vertical;
        background: #0d0f14;
        color: #cfd4de;
        border: 1px solid #262b36;
        border-radius: 3px;
        padding: 8px;
        font: inherit;
        tab-size: 2;
      }
      .mb-badge-line {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .mb-points {
        color: #7d8598;
        font-size: 11px;
      }
      .mb-badge-detail {
        margin-top: 3px;
        color: #6d7486;
        font-size: 11px;
      }
      .mb-summary {
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      .mb-agreement {
        color: #cfd4de;
      }
      .mb-watch,
      .mb-pulses {
        color: #6d7486;
        font-size: 11px;
      }
      /* The panel's whole point: not "wrong", but wrong HERE, on this vector,
         about this signal, one click from the waveform. */
      .mb-divergence {
        margin-top: 6px;
        padding: 8px;
        border: 1px solid #8c3238;
        border-radius: 3px;
        background: #180f11;
        color: #f0b6ba;
        font-size: 11px;
      }
      .mb-divergence-head {
        color: #f08a90;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .mb-agreed {
        margin-top: 6px;
        color: #f2cc4d;
        font-size: 11px;
      }
      /* "Nothing was tested" has to read as a warning, not as a pass. */
      .mb-vacuous {
        margin-top: 6px;
        padding: 4px 8px;
        border-left: 2px solid #97741f;
        background: #1c1710;
        color: #f2cc4d;
        font-size: 11px;
      }
      .mb-mismatches {
        margin-top: 6px;
        color: #9aa2b5;
        font-size: 11px;
      }
      .mb-error {
        padding: 8px;
        border-left: 2px solid #8c3238;
        color: #f08a90;
        white-space: pre-wrap;
        font-size: 11px;
      }

      /* ---- register inspector (§4.5) ------------------------------------ */
      .ri-panel { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }
      .ri-loading, .ri-hint { padding: 8px; color: #6d7486; font-size: 11px; }
      .ri-hint.bad { color: #f08a90; }
      .ri-body { display: flex; flex-direction: column; height: 100%; min-height: 0; }
      .ri-toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid #1c2130; }
      .ri-count { color: #9aa2b5; font-size: 11px; }
      .ri-main { display: flex; flex: 1; min-height: 0; }
      .ri-adhoc {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: none;
        padding: 6px;
        border-top: 1px solid #1c2130;
      }
      .ri-adhoc-flops {
        flex: 1;
        min-width: 0;
        background: #10131a;
        color: #cfd4de;
        border: 1px solid #262b36;
        border-radius: 3px;
        padding: 3px 6px;
      }
      .ri-adhoc-status {
        color: #7d8598;
        font-size: 10px;
        white-space: nowrap;
      }
      .ri-adhoc-status.bad {
        color: #f08a90;
      }
      /* A column now, because the ad-hoc group row sits below the list. */
      .ri-list-col { width: 260px; flex: none; border-right: 1px solid #1c2130; min-height: 0; display: flex; flex-direction: column; }
      .ri-list-viewport { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
      .ri-row { display: flex; align-items: center; gap: 6px; padding: 0 8px; cursor: pointer; font-size: 12px; }
      .ri-row:hover { background: #12151d; }
      .ri-row-selected { background: #1a2130; }
      .ri-row-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ri-row-role { color: #8ecdf7; font-size: 10px; }
      .ri-row-width { color: #6d7486; font-size: 10px; }
      .ri-detail { flex: 1; overflow-y: auto; min-height: 0; padding: 8px 12px; }
      .ri-detail-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
      .ri-title { font-weight: 600; font-size: 13px; }
      .ri-badge { background: #1a2130; border: 1px solid #2e3444; border-radius: 3px; padding: 1px 6px; font-size: 10px; color: #8ecdf7; }
      .ri-sub { color: #6d7486; font-size: 11px; }
      .ri-description { color: #9aa2b5; font-size: 12px; margin-bottom: 8px; }
      .ri-evidence { color: #6d7486; font-size: 11px; margin-bottom: 8px; }
      .ri-section { margin-bottom: 14px; }
      .ri-section-title { color: #9aa2b5; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
      .ri-guard-line { font-size: 12px; margin-bottom: 2px; }
      .ri-guard-cond { color: #cfd4de; }
      .ri-flops-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .ri-flop-chip { font-size: 11px; }
      .ri-truth-note { font-size: 11px; color: #6fbf73; margin-bottom: 4px; }
      .ri-truth-note.ri-sampled { color: #e0b34d; font-weight: 600; }
      .ri-truth-row { display: flex; gap: 10px; font-size: 11px; font-family: ui-monospace, Menlo, monospace; padding: 1px 0; }
      .ri-truth-header { color: #9aa2b5; border-bottom: 1px solid #1c2130; margin-bottom: 2px; }
      .ri-truth-cell { min-width: 18px; text-align: center; }
      .ri-truth-value { border-left: 1px solid #1c2130; padding-left: 8px; color: #8ecdf7; }
      .ri-orbit-form { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
      .ri-orbit-kind { font-size: 12px; color: #8ecdf7; margin-bottom: 4px; }
      .ri-orbit-states { display: flex; flex-wrap: wrap; gap: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #9aa2b5; }
      .ri-orbit-state { white-space: nowrap; }

      /* ---- requirements panel (§4.9) ------------------------------------- */
      .rq-toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid #1c2130; }
      .rq-net { width: 140px; }
      .rq-status { color: #9aa2b5; font-size: 11px; }
      .rq-status.bad { color: #f08a90; }
      .rq-loading { padding: 8px; color: #6d7486; font-size: 11px; }
      .rq-body { flex: 1; overflow-y: auto; padding: 8px 12px; min-height: 0; }
      .rq-summary { font-size: 12px; margin-bottom: 8px; color: #cfd4de; }
      .rq-conflicts { color: #f08a90; font-size: 11px; margin-bottom: 8px; }
      .rq-section { margin-bottom: 16px; }
      .rq-section-title { color: #9aa2b5; font-size: 11px; margin-bottom: 6px; }
      .rq-leaf { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 1px 0; }
      .rq-check { width: 14px; text-align: center; }
      .rq-check-yes { color: #6fbf73; }
      .rq-check-no { color: #f08a90; }
      .rq-check-unknown { color: #4b5162; }
      .rq-hint { color: #6d7486; font-size: 11px; }
      .rq-hint.bad { color: #f08a90; }
      .rq-eq { color: #6d7486; }
      .rq-claim-btn { margin-left: auto; font-size: 10px; padding: 1px 6px; }
      .rq-choice { border-left: 2px solid #2e3444; padding-left: 8px; margin-bottom: 8px; font-size: 12px; }
      .rq-choice-head { color: #9aa2b5; margin-bottom: 2px; }
      .rq-choice-option { display: flex; gap: 6px; align-items: center; margin-bottom: 2px; }
      .rq-choice-bullet { color: #6d7486; }
      .rq-choice-chip { font-size: 11px; }

      /* ---- sensitivity panel (§4.10) ------------------------------------- */
      .sv-panel { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }
      .sv-toolbar { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-bottom: 1px solid #1c2130; }
      .sv-inline { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #9aa2b5; }
      .sv-from, .sv-to { width: 56px; }
      .sv-status { color: #9aa2b5; font-size: 11px; }
      .sv-status.bad { color: #f08a90; }
      .sv-loading { padding: 8px; color: #6d7486; font-size: 11px; }
      .sv-body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
      .sv-warnings { padding: 4px 8px; }
      .sv-warning { color: #e0b34d; font-size: 11px; margin-bottom: 2px; }
      .sv-baseline-note { color: #6d7486; font-size: 11px; }
      .sv-readout { padding: 2px 8px; color: #9aa2b5; font-size: 11px; }
      .sv-canvas-wrap { flex: 1; overflow: auto; padding: 4px 8px; }

      /* ---- register decoder panel (§4.11) -------------------------------- */
      .rd-panel { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }
      .rd-loading, .rd-hint { padding: 8px; color: #6d7486; font-size: 11px; }
      .rd-hint.bad { color: #f08a90; }
      .rd-body { display: flex; flex-direction: column; height: 100%; min-height: 0; overflow-y: auto; }
      .rd-toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid #1c2130; }
      .rd-flops { flex: 1; }
      .rd-status { color: #9aa2b5; font-size: 11px; }
      .rd-status.bad { color: #f08a90; }
      .rd-groups { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px; }
      .rd-group-chip { border: 1px solid #2e3444; border-radius: 3px; padding: 3px 8px; cursor: pointer; font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
      .rd-group-chip:hover { border-color: #4a536b; background: #12151d; }
      .rd-detail { padding: 4px 12px 16px; }
      .rd-group-title { font-weight: 600; font-size: 13px; margin: 6px 0; }
      .rd-section { margin-bottom: 16px; }
      .rd-section-title { color: #9aa2b5; font-size: 11px; margin-bottom: 6px; }
      .rd-toggle-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
      .rd-inline { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #9aa2b5; margin-right: 8px; }
      .rd-inline input { width: 60px; }
      .rd-weight-line { display: flex; align-items: center; gap: 2px; font-size: 12px; padding: 1px 0; }
      .rd-weight-unknown { color: #6d7486; font-style: italic; }
      .rd-weight-value { color: #cfd4de; }
      .rd-weight-tag { color: #6d7486; font-size: 10px; }
      .rd-by-elimination { color: #e0b34d !important; font-weight: 600; cursor: help; }
      .rd-orbit-kind { font-size: 12px; color: #8ecdf7; margin-bottom: 4px; }
      .rd-orbit-states { display: flex; flex-wrap: wrap; gap: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #9aa2b5; margin-top: 4px; }
      .rd-select-row { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #9aa2b5; }

      /* ---- sticky flops panel (§4.12) ------------------------------------ */
      .sf-panel { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }
      .sf-toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid #1c2130; }
      .sf-count { color: #9aa2b5; font-size: 11px; }
      .sf-suggest { font-size: 11px; }
      .sf-status { color: #9aa2b5; font-size: 11px; }
      .sf-status.bad { color: #f08a90; }
      .sf-loading { padding: 8px; color: #6d7486; font-size: 11px; }
      .sf-body { flex: 1; overflow-y: auto; padding: 4px 8px; }
      .sf-row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 3px 0; border-bottom: 1px solid #14171f; }
      .sf-flop { flex: none; }
      .sf-polarity { color: #8ecdf7; font-size: 11px; }
      .sf-condition { color: #6d7486; font-size: 11px; font-family: ui-monospace, Menlo, monospace; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sf-suggestion-tag { color: #e0b34d; font-size: 10px; cursor: help; border: 1px solid #4a3f22; border-radius: 3px; padding: 1px 6px; }
      .sf-classify-btn { font-size: 10px; padding: 2px 8px; }
      .sf-classify-btn.active { background: #2a3547; border-color: #4d6a9e; color: #cfe0ff; }

      /* ---- constraints panel (§4.13) -------------------------------------- */
      .cs-panel { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; overflow-y: auto; }
      .cs-toolbar { display: flex; align-items: center; padding: 6px 8px; border-bottom: 1px solid #1c2130; }
      .cs-note { color: #6d7486; font-size: 11px; font-style: italic; }
      .cs-add { display: flex; gap: 6px; padding: 6px 8px; border-bottom: 1px solid #1c2130; }
      .cs-name { width: 100px; }
      .cs-elements { flex: 1; }
      .cs-k { width: 60px; }
      .cs-rows { padding: 4px 8px; }
      .cs-row { display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: ui-monospace, Menlo, monospace; padding: 2px 0; }
      .cs-row-name { color: #cfd4de; min-width: 90px; }
      .cs-row-source { color: #6d7486; }
      .cs-row-elements { color: #9aa2b5; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cs-row-exactly { color: #6d7486; }
      .cs-row-k { width: 50px; }
      .cs-summary { padding: 4px 8px; }
      .cs-summary-line { color: #9aa2b5; font-size: 11px; }
      .cs-warning { color: #e0b34d; font-size: 11px; margin-top: 4px; }
      .cs-solve-bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; }
      .cs-solve-status { color: #9aa2b5; font-size: 11px; }
      .cs-solutions { padding: 0 8px 8px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #9aa2b5; }

      /* ---- python REPL drawer (§4.14) ------------------------------------ */
      .repl-panel { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
      .repl-loading { padding: 8px; color: #6d7486; font-size: 11px; }
      .repl-body { display: flex; flex-direction: column; height: 100%; min-height: 0; }
      .repl-output { flex: 1; overflow-y: auto; padding: 6px 8px; }
      .repl-entry { margin-bottom: 8px; }
      .repl-echo { color: #8ecdf7; white-space: pre-wrap; }
      .repl-stdout, .repl-repr, .repl-rendered { margin: 2px 0 0; color: #cfd4de; white-space: pre-wrap; word-break: break-word; }
      .repl-rendered { color: #9fe39f; }
      .repl-error { margin: 2px 0 0; color: #f08a90; white-space: pre-wrap; word-break: break-word; }
      .repl-input-row { display: flex; align-items: flex-end; gap: 6px; padding: 6px 8px; border-top: 1px solid #1c2130; }
      .repl-prompt { color: #6d7486; padding-bottom: 4px; }
      .repl-input { flex: 1; resize: none; font: inherit; background: #10131a; color: #cfd4de; border: 1px solid #262b36; border-radius: 3px; padding: 4px 6px; max-height: 200px; }

      /* ---- labels: the glossary the player builds ----------------------- */
      .labels-panel { display: flex; flex-direction: column; height: 100%; }
      .labels-toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid #1c2130; }
      .labels-filter { flex: 1; background: #10131a; color: #cfd4de; border: 1px solid #262b36; border-radius: 3px; padding: 3px 6px; }
      .labels-count { color: #7d8598; font-size: 11px; white-space: nowrap; }
      .labels-body { flex: 1; overflow-y: auto; }
      .labels-empty { padding: 12px; color: #6d7486; line-height: 1.6; max-width: 60ch; }
      .labels-row { display: flex; align-items: center; gap: 8px; padding: 3px 8px; }
      .labels-row:hover { background: #171b26; }
      .labels-kind { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; border: 1px solid #2e3444; border-radius: 3px; padding: 0 4px; color: #7d8598; }
      .labels-kind-net { color: #8ecdf7; border-color: #274a63; }
      .labels-kind-instance { color: #9fe39f; border-color: #2b4a2b; }
      .labels-label { color: #f2cc4d; font-style: italic; }
      .labels-raw { color: #6d7486; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .labels-actions { display: flex; gap: 4px; margin-left: auto; }
      .labels-actions button { padding: 1px 6px; font-size: 11px; }
      .labels-drop { color: #a8707a; }

      /* ---- guided walkthrough (guide/guide.ts) -------------------------- */
      /* Floats over the workspace bottom-left: the die view keeps its layer
         box top-left and its minimap bottom-right, so this is the one corner
         nothing else claims. Collapsible, because a player who wants the
         whole panel back should not have to close the guide to get it. */
      .guide-card {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 50;
        width: 400px;
        max-width: calc(100vw - 24px);
        max-height: 60vh;
        display: flex;
        flex-direction: column;
        background: #10131a;
        border: 1px solid #3a4258;
        border-radius: 5px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
      }
      .guide-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #262b36;
      }
      .guide-collapsed .guide-head {
        border-bottom: 0;
      }
      .guide-badge {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #f2cc4d;
      }
      .guide-count {
        color: #7d8598;
        font-size: 11px;
      }
      .guide-collapse {
        margin-left: auto;
      }
      .guide-head button {
        padding: 0 6px;
        color: #7d8598;
      }
      .guide-title {
        margin: 10px 10px 0;
        font-size: 13px;
        color: #e6e9f0;
      }
      .guide-body {
        overflow-y: auto;
        padding: 0 10px;
        margin: 6px 0;
      }
      .guide-body p {
        margin: 8px 0;
        line-height: 1.65;
        color: #b6bdcc;
      }
      .guide-body code {
        color: #8ecdf7;
        background: #171b26;
        border-radius: 3px;
        padding: 0 3px;
      }
      .guide-goal {
        margin: 0 10px 8px;
        padding: 4px 8px;
        border: 1px dashed #2e3444;
        border-radius: 4px;
        color: #7d8598;
      }
      .guide-goal-done {
        color: #9fe39f;
        border-style: solid;
        border-color: #2b4a2b;
        background: #131c13;
      }
      .guide-foot {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px;
        border-top: 1px solid #262b36;
      }
      .guide-next {
        font-weight: 600;
        color: #e6e9f0;
      }
      .guide-jump {
        margin-left: auto;
        max-width: 170px;
        background: #1a1f2b;
        border: 1px solid #2e3444;
        border-radius: 3px;
        padding: 2px 4px;
      }
      .gdsx-guide-btn.on {
        border-color: #5a4d1f;
        color: #f2cc4d;
      }
    </style>
  </head>
  <body>
    <div id="workspace"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
