<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/vite.svg" />
    <title>gdsx / die view</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0f14;
        color: #cfd4de;
        overflow: hidden;
      }
      #workspace {
        position: absolute;
        inset: 0;
      }

      /* ---- dockview panel chrome ------------------------------------- */
      .gdsx-panel {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0f14;
      }

      /* ---- die view panel --------------------------------------------- */
      .die-canvas-wrap {
        position: absolute;
        inset: 0;
      }
      .die-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      .die-canvas:active {
        cursor: grabbing;
      }
      .die-loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6d7486;
      }
      .die-minimap {
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 200px;
        height: 140px;
        border: 1px solid #262b36;
        border-radius: 4px;
        cursor: crosshair;
      }

      .panel-overlay {
        position: absolute;
        background: rgba(16, 19, 26, 0.88);
        border: 1px solid #262b36;
        border-radius: 4px;
        padding: 8px 10px;
      }
      .die-layers {
        top: 10px;
        left: 10px;
        min-width: 130px;
      }
      .die-stats {
        top: 10px;
        right: 10px;
        white-space: pre;
        line-height: 1.5;
        margin: 0;
      }
      .die-layers label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 1px 0;
        cursor: pointer;
      }
      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        display: inline-block;
      }
      .panel-overlay h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #7d8598;
        margin: 0 0 6px;
        font-weight: 600;
      }
      .panel-overlay hr {
        border: 0;
        border-top: 1px solid #262b36;
        margin: 8px 0 6px;
      }
      .panel-overlay select {
        background: #10131a;
        color: #cfd4de;
        border: 1px solid #262b36;
        font: inherit;
        width: 100%;
      }
      .panel-overlay .hint {
        color: #6d7486;
      }

      /* ---- shared bits: toolbar controls, net chips, { } button -------- */
      input[type="text"],
      select,
      button {
        font: inherit;
        color: #cfd4de;
      }
      button {
        background: #1a1f2b;
        border: 1px solid #2e3444;
        border-radius: 3px;
        padding: 3px 8px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: #4a536b;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.active {
        background: #2a3547;
        border-color: #4d6a9e;
        color: #cfe0ff;
      }
      input[type="text"] {
        background: #10131a;
        border: 1px solid #262b36;
        border-radius: 3px;
        padding: 4px 6px;
      }
      select {
        background: #10131a;
        border: 1px solid #262b36;
        border-radius: 3px;
        padding: 3px 4px;
      }

      .net-chip {
        color: #8ecdf7;
        cursor: pointer;
        border-bottom: 1px dotted transparent;
      }
      .net-chip:hover {
        border-bottom-color: #8ecdf7;
      }

      .py-call-slot {
        position: relative;
        margin-left: auto;
      }
      .py-call-btn {
        font-weight: 600;
      }
      .py-call-popover {
        position: absolute;
        top: 100%;
        right: 0;
        z-index: 20;
        margin-top: 4px;
        width: min(480px, 60vw);
        background: #0d0f14;
        border: 1px solid #2e3444;
        border-radius: 4px;
        padding: 8px;
      }
      .py-call-popover pre {
        margin: 0 0 6px;
        white-space: pre-wrap;
        word-break: break-word;
        color: #9fe39f;
      }

      /* ---- virtualised list --------------------------------------------- */
      .vlist {
        position: relative;
        overflow-y: auto;
        height: 100%;
      }
      .vlist-sizer {
        position: relative;
      }
      .vlist-rows {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
      }

      /* ---- netlist browser ----------------------------------------------- */
      .netlist-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .netlist-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 8px;
        border-bottom: 1px solid #1c2130;
        flex-wrap: wrap;
      }
      .netlist-tabs {
        display: flex;
        gap: 4px;
      }
      .netlist-check {
        display: flex;
        align-items: center;
        gap: 4px;
        color: #9aa2b5;
      }
      .netlist-count {
        color: #6d7486;
      }
      .netlist-loading {
        padding: 16px;
        color: #6d7486;
      }
      .netlist-body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .netlist-list-instances,
      .netlist-list-nets {
        flex: 1;
        min-width: 0;
        border-right: 1px solid #1c2130;
      }
      .netlist-detail {
        width: 260px;
        flex: none;
        overflow-y: auto;
        padding: 10px;
        box-sizing: border-box;
      }
      .netlist-detail-empty {
        color: #6d7486;
      }
      .nrow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
      }
      .nrow:hover {
        background: #171b26;
      }
      .nrow.active {
        background: #202a3d;
      }
      .nrow-name {
        color: #cfd4de;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nrow-badge {
        color: #7d8598;
        font-size: 11px;
      }
      .nrow-seq {
        color: #f2cc4d;
        font-size: 10px;
        border: 1px solid #5a4d1f;
        border-radius: 3px;
        padding: 0 3px;
      }
      .nrow-port {
        color: #66e6e6;
        font-size: 10px;
        border: 1px solid #245a5a;
        border-radius: 3px;
        padding: 0 3px;
      }
      .detail-box h3 {
        margin: 0 0 6px;
        font-size: 12px;
        word-break: break-all;
      }
      .detail-box h4 {
        margin: 10px 0 4px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #7d8598;
      }
      .detail-meta {
        color: #9aa2b5;
        line-height: 1.6;
      }
      .detail-fn {
        color: #9fe39f;
        word-break: break-all;
      }
      .detail-conn-row {
        display: flex;
        gap: 6px;
        padding: 1px 0;
      }
      .detail-pin {
        color: #7d8598;
        min-width: 28px;
      }
      .detail-open-cone {
        margin-top: 8px;
        width: 100%;
      }

      /* ---- cone walker ---------------------------------------------------- */
      .cone-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .cw-toolbar,
      .cw-flatten-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #1c2130;
        flex-wrap: wrap;
      }
      .cw-net-input {
        flex: 1;
        min-width: 120px;
      }
      .cw-direction {
        display: flex;
        gap: 4px;
      }
      .cw-focus {
        color: #9aa2b5;
      }
      .cw-focus-net {
        color: #f2cc4d;
      }
      .cw-value-toggle {
        display: flex;
        gap: 4px;
      }
      .cw-loading {
        padding: 16px;
        color: #6d7486;
      }
      .cw-body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .cw-tree {
        flex: 1;
        overflow: auto;
        padding: 6px 4px;
      }
      .cw-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 4px;
        border-radius: 3px;
        white-space: nowrap;
      }
      .cw-row:hover {
        background: #171b26;
      }
      .cw-expander {
        width: 18px;
        height: 18px;
        padding: 0;
        line-height: 1;
        flex: none;
      }
      .cw-expander-none {
        border-color: transparent;
        background: transparent;
        cursor: default;
      }
      .cw-truncated {
        color: #f2a65a;
        border-color: #5a3f24;
      }
      .cw-truncated-label {
        color: #f2a65a;
        font-size: 11px;
      }
      .cw-cell {
        color: #7d8598;
        font-size: 11px;
      }
      .cw-fn {
        color: #9fe39f;
        font-size: 11px;
      }
      .cw-pins {
        display: inline-flex;
        gap: 6px;
        margin-left: 6px;
      }
      .cw-pin-label {
        color: #5b6274;
        font-size: 10px;
      }
      .cw-cycle-badge {
        color: #cfe0ff;
        background: #1c2740;
        border: 1px solid #2f4166;
        border-radius: 3px;
        font-size: 10px;
        padding: 0 4px;
      }
      .cw-leaf {
        font-size: 10px;
        border-radius: 3px;
        padding: 0 4px;
      }
      .cw-leaf-primary_in {
        color: #8ecdf7;
        border: 1px solid #24405a;
      }
      .cw-leaf-const0,
      .cw-leaf-const1 {
        color: #9aa2b5;
        border: 1px solid #2e3444;
      }
      .cw-leaf-flop_q {
        color: #f2cc4d;
        border: 1px solid #5a4d1f;
      }
      .cw-leaf-undriven {
        color: #f2735a;
        border: 1px solid #5a2e24;
      }
      .cw-step-btn {
        font-size: 11px;
        padding: 1px 6px;
      }
      .cw-step-error {
        color: #f2735a;
        font-size: 11px;
      }
      .cw-flatten-panel {
        width: 320px;
        flex: none;
        border-left: 1px solid #1c2130;
        overflow-y: auto;
        padding: 8px 10px;
        box-sizing: border-box;
      }
      .cw-flatten-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .cw-flatten-title {
        color: #f2cc4d;
        word-break: break-all;
      }
      .cw-flatten-close {
        padding: 0 6px;
      }
      .cw-flatten-summary {
        color: #9aa2b5;
        margin-bottom: 8px;
      }
      .cw-flatten-leaves {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .cw-flatten-leaf {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .cw-polarity {
        width: 16px;
        height: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 3px;
        font-size: 10px;
      }
      .cw-polarity-1 {
        background: #1f3a24;
        color: #9fe39f;
      }
      .cw-polarity-0 {
        background: #3a2020;
        color: #f2a5a5;
      }
      .cw-flatten-choices {
        margin-top: 10px;
      }
      .cw-flatten-choices h4 {
        margin: 0 0 6px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #7d8598;
      }
      .cw-choice {
        margin-bottom: 6px;
      }
      .cw-choice-head {
        color: #9aa2b5;
      }
      .cw-choice-option {
        color: #f2a65a;
        padding-left: 10px;
        font-size: 11px;
      }
      .cw-flatten-conflicts {
        margin-top: 10px;
        color: #f2735a;
      }

      /* ---- waveform + sequence editor: shared bits ----------------------- */
      .wave-panel,
      .seq-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .wave-toolbar,
      .seq-toolbar {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #1c2130;
        flex: none;
      }
      .wave-loading,
      .seq-loading {
        padding: 16px;
        color: #6d7486;
      }
      .wave-body,
      .seq-body {
        flex: 1;
        overflow: auto;
        min-height: 0;
      }

      /* ---- waveform -------------------------------------------------------- */
      .wave-search {
        width: 220px;
      }
      .wave-suggest {
        position: absolute;
        top: 100%;
        left: 8px;
        z-index: 20;
        background: #10131a;
        border: 1px solid #2e3444;
        border-radius: 4px;
        max-height: 220px;
        overflow-y: auto;
        min-width: 220px;
      }
      .wave-suggest-item {
        padding: 3px 8px;
        cursor: pointer;
      }
      .wave-suggest-item:hover {
        background: #1c2130;
        color: #f2cc4d;
      }
      .wave-ruler-row {
        display: flex;
        position: sticky;
        top: 0;
        background: #0d0f14;
        z-index: 2;
        border-bottom: 1px solid #1c2130;
      }
      .wave-label-spacer {
        width: 180px;
        flex: none;
      }
      .wave-ruler {
        position: relative;
        height: 16px;
        flex: none;
      }
      .wave-tick {
        position: absolute;
        top: 0;
        color: #5b6274;
        font-size: 9px;
        border-left: 1px solid #262b36;
        padding-left: 2px;
      }
      .wave-row {
        display: flex;
        align-items: center;
        border-bottom: 1px solid #171b26;
      }
      .wave-row-label {
        width: 180px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 4px;
        cursor: grab;
        overflow: hidden;
      }
      .wave-drag-handle {
        color: #4a536b;
        font-size: 10px;
      }
      .wave-row-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .wave-row-name:hover {
        color: #f2cc4d;
      }
      .wave-row-remove {
        padding: 0 5px;
        color: #6d7486;
      }
      .wave-row-canvas {
        display: block;
        flex: none;
        cursor: crosshair;
      }

      /* ---- sequence editor -------------------------------------------------- */
      .seq-cycles {
        width: 60px;
      }
      .seq-result {
        margin-left: auto;
        color: #6d7486;
      }
      .seq-result.latched {
        color: #9fe39f;
      }
      .seq-track {
        border-bottom: 1px solid #171b26;
        padding: 4px 8px;
      }
      .seq-track-header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      .seq-track-name {
        width: 70px;
        flex: none;
        color: #cfd4de;
        font-weight: 600;
      }
      .seq-track-io {
        flex: 1;
        max-width: 340px;
      }
      .seq-track-btn {
        font-size: 11px;
        padding: 1px 6px;
      }
      .seq-ruler {
        position: relative;
        height: 14px;
        margin-left: 0;
      }
      .seq-tick {
        position: absolute;
        top: 0;
        color: #5b6274;
        font-size: 9px;
      }
      .seq-cells {
        position: relative;
        height: 20px;
        touch-action: none;
      }
      .seq-cell {
        position: absolute;
        top: 0;
        background: #171b26;
        border-right: 1px solid #0d0f14;
        box-sizing: border-box;
      }
      .seq-cell.epoch {
        border-right: 1px solid #2e3444;
      }
      .seq-cell.on {
        background: #3a6b3a;
      }
      .seq-cell.cursor {
        outline: 1px solid #f2cc4d;
        outline-offset: -1px;
      }
    </style>
  </head>
  <body>
    <div id="workspace"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
