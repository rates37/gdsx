<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/vite.svg" />
    <title>gdsx / M0 spike — die view</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0f14;
        color: #cfd4de;
        overflow: hidden;
      }
      #die {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      #die:active {
        cursor: grabbing;
      }
      .panel {
        position: absolute;
        background: rgba(16, 19, 26, 0.88);
        border: 1px solid #262b36;
        border-radius: 4px;
        padding: 8px 10px;
      }
      #layers {
        top: 10px;
        left: 10px;
        min-width: 130px;
      }
      #stats {
        top: 10px;
        right: 10px;
        white-space: pre;
        line-height: 1.5;
      }
      #layers label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 1px 0;
        cursor: pointer;
      }
      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        display: inline-block;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #7d8598;
        margin: 0 0 6px;
        font-weight: 600;
      }
      hr {
        border: 0;
        border-top: 1px solid #262b36;
        margin: 8px 0 6px;
      }
      select {
        background: #10131a;
        color: #cfd4de;
        border: 1px solid #262b36;
        font: inherit;
        width: 100%;
      }
      .hint {
        color: #6d7486;
      }
    </style>
  </head>
  <body>
    <canvas id="die"></canvas>
    <div class="panel" id="layers">
      <h2>Layers</h2>
      <div id="layer-list"></div>
      <hr />
      <h2>Detail</h2>
      <select id="lod">
        <option value="auto" selected>auto (by zoom)</option>
        <option value="0">LOD 0 — full</option>
        <option value="1">LOD 1 — collapsed</option>
        <option value="2">LOD 2 — cells only</option>
      </select>
      <hr />
      <div class="hint">drag: pan<br />wheel: zoom<br />F: fit die</div>
    </div>
    <pre class="panel" id="stats">loading render.bin…</pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
