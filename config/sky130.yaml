# Layer map for the sky130 standard-cell flow
#
# Only the layers we trace in gdsx are listed: the routing stack, the vias,
# and the pin/label purposes where cell pins are named
# Everything else in the GDS is deliberately ignored , we don't need to inspect
# individual cells here
#
# Numbers are (layer, datatype) pairs. Note tests/test_config.py checks them against
# what is in the sample (warmup) GDS

pdk: sky130A
library: sky130_fd_sc_hd

# Bottom to top. `pin` is where the text labels live. The geometry itself is on
# `drawing`, so a pin is resolved by finding the drawing shape under its label
routing:
  - {name: li1,  drawing: [67, 20], pin: [67, 5], label: [67, 16]}
  - {name: met1, drawing: [68, 20], pin: [68, 5], label: [68, 16]}
  - {name: met2, drawing: [69, 20], pin: [69, 5], label: [69, 16]}
  - {name: met3, drawing: [70, 20], pin: [70, 5], label: [70, 16]}
  - {name: met4, drawing: [71, 20], pin: [71, 5], label: [71, 16]}
  - {name: met5, drawing: [72, 20], pin: [72, 5], label: [72, 16]}

vias:
  - {name: mcon, layer: [67, 44], below: li1,  above: met1}
  - {name: via,  layer: [68, 44], below: met1, above: met2}
  - {name: via2, layer: [69, 44], below: met2, above: met3}
  - {name: via3, layer: [70, 44], below: met3, above: met4}
  - {name: via4, layer: [71, 44], below: met4, above: met5}

# The physical layer stack, bottom to top, in microns. `z` is the bottom of
# the layer and `thickness` its height, so z(n+1) == z(n) + thickness(n) for a
# contiguous stack. Values approximate the public sky130 interconnect stack
# (li1 through met5); this is for an honest-looking 3D view, not a substitute
# for the PDK's own tech file. `via: true` marks a via/contact layer rather
# than a routing layer.
stack:
  - {name: li1,  z: 0.936, thickness: 0.100}
  - {name: mcon, z: 1.036, thickness: 0.330, via: true}
  - {name: met1, z: 1.366, thickness: 0.360}
  - {name: via,  z: 1.726, thickness: 0.270, via: true}
  - {name: met2, z: 1.996, thickness: 0.370}
  - {name: via2, z: 2.366, thickness: 0.420, via: true}
  - {name: met3, z: 2.786, thickness: 0.845}
  - {name: via3, z: 3.631, thickness: 0.390, via: true}
  - {name: met4, z: 4.021, thickness: 0.845}
  - {name: via4, z: 4.866, thickness: 0.505, via: true}
  - {name: met5, z: 5.371, thickness: 1.260}

power_pins: [VPWR, VGND, VPB, VNB]

# Cells that carry no signal function. They still have the common prefix,
# but they should not show up as gates in the netlist
nonlogic_prefixes:
  - sky130_fd_sc_hd__fill
  - sky130_fd_sc_hd__decap
  - sky130_fd_sc_hd__tap
  - sky130_fd_sc_hd__diode
  - sky130_fd_sc_hd__fakediode
