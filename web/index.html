<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/vite.svg" />
    <title>gdsx / die view</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0f14;
        color: #cfd4de;
        overflow: hidden;
      }
      #workspace {
        position: absolute;
        inset: 0;
      }

      /* ---- app toolbar: reset layout, reopen closed tabs --------------- */
      .gdsx-toolbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 28px;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px;
        background: #10131a;
        border-bottom: 1px solid #262b36;
        box-sizing: border-box;
      }
      .gdsx-toolbar-title {
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #7d8598;
        font-size: 11px;
      }
      .gdsx-toolbar-spacer {
        flex: 1;
      }
      .gdsx-toolbar-status {
        color: #9aa2b5;
        font-size: 11px;
      }
      .gdsx-toolbar button {
        background: #1a1f2b;
        color: #cfd4de;
        border: 1px solid #2e3444;
        border-radius: 3px;
        padding: 3px 8px;
        font: inherit;
        cursor: pointer;
      }
      .gdsx-toolbar button:hover:not(:disabled) {
        border-color: #4a536b;
      }
      .gdsx-toolbar button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .gdsx-reopen-wrap {
        position: relative;
      }
      .gdsx-reopen-menu {
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 4px;
        min-width: 160px;
        background: #10131a;
        border: 1px solid #2e3444;
        border-radius: 4px;
        overflow: hidden;
        z-index: 31;
      }
      .gdsx-reopen-item {
        padding: 5px 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      .gdsx-reopen-item:hover {
        background: #1c2130;
        color: #f2cc4d;
      }
      .gdsx-dock-mount {
        position: absolute;
        top: 28px;
        left: 0;
        right: 0;
        bottom: 0;
      }

      /* ---- dockview panel chrome ------------------------------------- */
      .gdsx-panel {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0f14;
      }

      /* ---- die view panel --------------------------------------------- */
      .die-canvas-wrap {
        position: absolute;
        inset: 0;
      }
      .die-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      .die-canvas:active {
        cursor: grabbing;
      }
      .die-loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6d7486;
      }
      .die-minimap {
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 200px;
        height: 140px;
        border: 1px solid #262b36;
        border-radius: 4px;
        cursor: crosshair;
      }

      .panel-overlay {
        position: absolute;
        background: rgba(16, 19, 26, 0.88);
        border: 1px solid #262b36;
        border-radius: 4px;
        padding: 8px 10px;
      }
      .die-layers {
        top: 10px;
        left: 10px;
        min-width: 130px;
      }
      .die-stats {
        top: 10px;
        right: 10px;
        white-space: pre;
        line-height: 1.5;
        margin: 0;
      }
      .die-layers label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 1px 0;
        cursor: pointer;
      }
      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        display: inline-block;
      }
      .panel-overlay h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #7d8598;
        margin: 0 0 6px;
        font-weight: 600;
      }
      .panel-overlay hr {
        border: 0;
        border-top: 1px solid #262b36;
        margin: 8px 0 6px;
      }
      .panel-overlay select {
        background: #10131a;
        color: #cfd4de;
        border: 1px solid #262b36;
        font: inherit;
        width: 100%;
      }
      .panel-overlay .hint {
        color: #6d7486;
      }

      /* ---- shared bits: toolbar controls, net chips, { } button -------- */
      input[type="text"],
      select,
      button {
        font: inherit;
        color: #cfd4de;
      }
      button {
        background: #1a1f2b;
        border: 1px solid #2e3444;
        border-radius: 3px;
        padding: 3px 8px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: #4a536b;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.active {
        background: #2a3547;
        border-color: #4d6a9e;
        color: #cfe0ff;
      }
      input[type="text"] {
        background: #10131a;
        border: 1px solid #262b36;
        border-radius: 3px;
        padding: 4px 6px;
      }
      select {
        background: #10131a;
        border: 1px solid #262b36;
        border-radius: 3px;
        padding: 3px 4px;
      }

      .net-chip {
        color: #8ecdf7;
        cursor: pointer;
        border-bottom: 1px dotted transparent;
      }
      .net-chip:hover {
        border-bottom-color: #8ecdf7;
      }

      .py-call-slot {
        position: relative;
        margin-left: auto;
      }
      .py-call-btn {
        font-weight: 600;
      }
      .py-call-popover {
        position: absolute;
        top: 100%;
        right: 0;
        z-index: 20;
        margin-top: 4px;
        width: min(480px, 60vw);
        background: #0d0f14;
        border: 1px solid #2e3444;
        border-radius: 4px;
        padding: 8px;
      }
      .py-call-popover pre {
        margin: 0 0 6px;
        white-space: pre-wrap;
        word-break: break-word;
        color: #9fe39f;
      }

      /* ---- virtualised list --------------------------------------------- */
      .vlist {
        position: relative;
        overflow-y: auto;
        height: 100%;
      }
      .vlist-sizer {
        position: relative;
      }
      .vlist-rows {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
      }

      /* ---- netlist browser ----------------------------------------------- */
      .netlist-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .netlist-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 8px;
        border-bottom: 1px solid #1c2130;
        flex-wrap: wrap;
      }
      .netlist-tabs {
        display: flex;
        gap: 4px;
      }
      .netlist-check {
        display: flex;
        align-items: center;
        gap: 4px;
        color: #9aa2b5;
      }
      .netlist-count {
        color: #6d7486;
      }
      .netlist-loading {
        padding: 16px;
        color: #6d7486;
      }
      .netlist-body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .netlist-list-instances,
      .netlist-list-nets {
        flex: 1;
        min-width: 0;
        border-right: 1px solid #1c2130;
      }
      .netlist-detail {
        width: 260px;
        flex: none;
        overflow-y: auto;
        padding: 10px;
        box-sizing: border-box;
      }
      .netlist-detail-empty {
        color: #6d7486;
      }
      .nrow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
      }
      .nrow:hover {
        background: #171b26;
      }
      .nrow.active {
        background: #202a3d;
      }
      .nrow-name {
        color: #cfd4de;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nrow-badge {
        color: #7d8598;
        font-size: 11px;
      }
      .nrow-seq {
        color: #f2cc4d;
        font-size: 10px;
        border: 1px solid #5a4d1f;
        border-radius: 3px;
        padding: 0 3px;
      }
      .nrow-port {
        color: #66e6e6;
        font-size: 10px;
        border: 1px solid #245a5a;
        border-radius: 3px;
        padding: 0 3px;
      }
      .detail-box h3 {
        margin: 0 0 6px;
        font-size: 12px;
        word-break: break-all;
      }
      .detail-box h4 {
        margin: 10px 0 4px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #7d8598;
      }
      .detail-meta {
        color: #9aa2b5;
        line-height: 1.6;
      }
      .detail-fn {
        color: #9fe39f;
        word-break: break-all;
      }
      .detail-conn-row {
        display: flex;
        gap: 6px;
        padding: 1px 0;
      }
      .detail-pin {
        color: #7d8598;
        min-width: 28px;
      }
      .detail-open-cone {
        margin-top: 8px;
        width: 100%;
      }

      /* ---- cone walker ---------------------------------------------------- */
      .cone-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .cw-toolbar,
      .cw-flatten-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #1c2130;
        flex-wrap: wrap;
      }
      .cw-net-input {
        flex: 1;
        min-width: 120px;
      }
      .cw-direction {
        display: flex;
        gap: 4px;
      }
      .cw-focus {
        color: #9aa2b5;
      }
      .cw-focus-net {
        color: #f2cc4d;
      }
      .cw-value-toggle {
        display: flex;
        gap: 4px;
      }
      .cw-loading {
        padding: 16px;
        color: #6d7486;
      }
      .cw-body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .cw-tree {
        flex: 1;
        overflow: auto;
        padding: 6px 4px;
      }
      .cw-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 4px;
        border-radius: 3px;
        white-space: nowrap;
      }
      .cw-row:hover {
        background: #171b26;
      }
      .cw-expander {
        width: 18px;
        height: 18px;
        padding: 0;
        line-height: 1;
        flex: none;
      }
      .cw-expander-none {
        border-color: transparent;
        background: transparent;
        cursor: default;
      }
      .cw-truncated {
        color: #f2a65a;
        border-color: #5a3f24;
      }
      .cw-truncated-label {
        color: #f2a65a;
        font-size: 11px;
      }
      .cw-cell {
        color: #7d8598;
        font-size: 11px;
      }
      .cw-fn {
        color: #9fe39f;
        font-size: 11px;
      }
      .cw-pins {
        display: inline-flex;
        gap: 6px;
        margin-left: 6px;
      }
      .cw-pin-label {
        color: #5b6274;
        font-size: 10px;
      }
      .cw-cycle-badge {
        color: #cfe0ff;
        background: #1c2740;
        border: 1px solid #2f4166;
        border-radius: 3px;
        font-size: 10px;
        padding: 0 4px;
      }
      .cw-leaf {
        font-size: 10px;
        border-radius: 3px;
        padding: 0 4px;
      }
      .cw-leaf-primary_in {
        color: #8ecdf7;
        border: 1px solid #24405a;
      }
      .cw-leaf-const0,
      .cw-leaf-const1 {
        color: #9aa2b5;
        border: 1px solid #2e3444;
      }
      .cw-leaf-flop_q {
        color: #f2cc4d;
        border: 1px solid #5a4d1f;
      }
      .cw-leaf-undriven {
        color: #f2735a;
        border: 1px solid #5a2e24;
      }
      .cw-step-btn {
        font-size: 11px;
        padding: 1px 6px;
      }
      .cw-step-error {
        color: #f2735a;
        font-size: 11px;
      }
      .cw-flatten-panel {
        width: 320px;
        flex: none;
        border-left: 1px solid #1c2130;
        overflow-y: auto;
        padding: 8px 10px;
        box-sizing: border-box;
      }
      .cw-flatten-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .cw-flatten-title {
        color: #f2cc4d;
        word-break: break-all;
      }
      .cw-flatten-close {
        padding: 0 6px;
      }
      .cw-flatten-summary {
        color: #9aa2b5;
        margin-bottom: 8px;
      }
      .cw-flatten-leaves {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .cw-flatten-leaf {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .cw-polarity {
        width: 16px;
        height: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 3px;
        font-size: 10px;
      }
      .cw-polarity-1 {
        background: #1f3a24;
        color: #9fe39f;
      }
      .cw-polarity-0 {
        background: #3a2020;
        color: #f2a5a5;
      }
      .cw-flatten-choices {
        margin-top: 10px;
      }
      .cw-flatten-choices h4 {
        margin: 0 0 6px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #7d8598;
      }
      .cw-choice {
        margin-bottom: 6px;
      }
      .cw-choice-head {
        color: #9aa2b5;
      }
      .cw-choice-option {
        color: #f2a65a;
        padding-left: 10px;
        font-size: 11px;
      }
      .cw-flatten-conflicts {
        margin-top: 10px;
        color: #f2735a;
      }

      /* ---- waveform + sequence editor: shared bits ----------------------- */
      .wave-panel,
      .seq-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .wave-toolbar,
      .seq-toolbar {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #1c2130;
        flex: none;
      }
      .wave-loading,
      .seq-loading {
        padding: 16px;
        color: #6d7486;
      }
      .wave-body,
      .seq-body {
        flex: 1;
        overflow: auto;
        min-height: 0;
      }

      /* ---- waveform -------------------------------------------------------- */
      .wave-search {
        width: 220px;
      }
      .wave-suggest {
        position: absolute;
        top: 100%;
        left: 8px;
        z-index: 20;
        background: #10131a;
        border: 1px solid #2e3444;
        border-radius: 4px;
        max-height: 220px;
        overflow-y: auto;
        min-width: 220px;
      }
      .wave-suggest-item {
        padding: 3px 8px;
        cursor: pointer;
      }
      .wave-suggest-item:hover {
        background: #1c2130;
        color: #f2cc4d;
      }
      .wave-ruler-row {
        display: flex;
        position: sticky;
        top: 0;
        background: #0d0f14;
        z-index: 2;
        border-bottom: 1px solid #1c2130;
      }
      .wave-label-spacer {
        width: 180px;
        flex: none;
      }
      .wave-ruler {
        position: relative;
        height: 16px;
        flex: none;
      }
      .wave-tick {
        position: absolute;
        top: 0;
        color: #5b6274;
        font-size: 9px;
        border-left: 1px solid #262b36;
        padding-left: 2px;
      }
      .wave-row {
        display: flex;
        align-items: center;
        border-bottom: 1px solid #171b26;
      }
      .wave-row-label {
        width: 180px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 4px;
        cursor: grab;
        overflow: hidden;
      }
      .wave-drag-handle {
        color: #4a536b;
        font-size: 10px;
      }
      .wave-row-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .wave-row-name:hover {
        color: #f2cc4d;
      }
      .wave-row-remove {
        padding: 0 5px;
        color: #6d7486;
      }
      .wave-row-canvas {
        display: block;
        flex: none;
        cursor: crosshair;
      }
      .wave-row-radix {
        flex: none;
        background: #10131a;
        color: #8ecdf7;
        border: 1px solid #262b36;
        border-radius: 3px;
        font: inherit;
        font-size: 10px;
        padding: 0 2px;
      }
      .wave-zoom {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-left: auto;
      }
      .wave-zoom button {
        width: 22px;
        padding: 2px 0;
        text-align: center;
      }

      /* ---- sequence editor -------------------------------------------------- */
      .seq-cycles {
        width: 60px;
      }
      .seq-toolbar-sep {
        width: 1px;
        align-self: stretch;
        background: #1c2130;
      }
      .seq-autorun {
        display: flex;
        align-items: center;
        gap: 4px;
        color: #9aa2b5;
        white-space: nowrap;
      }
      .seq-run-btn {
        white-space: nowrap;
      }
      .seq-run-status {
        color: #6d7486;
        white-space: nowrap;
        font-size: 11px;
      }
      .seq-run-status.dirty {
        color: #f2cc4d;
      }
      .seq-result.stale {
        color: #f2a65a !important;
      }
      .seq-result {
        margin-left: auto;
        color: #6d7486;
      }
      .seq-result.latched {
        color: #9fe39f;
      }
      .seq-track {
        border-bottom: 1px solid #171b26;
        padding: 4px 8px;
      }
      .seq-track-header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      .seq-track-name {
        width: 70px;
        flex: none;
        color: #cfd4de;
        font-weight: 600;
      }
      .seq-track-io {
        flex: 1;
        max-width: 340px;
      }
      .seq-track-btn {
        font-size: 11px;
        padding: 1px 6px;
      }
      .seq-ruler {
        position: relative;
        height: 14px;
        margin-left: 0;
      }
      .seq-tick {
        position: absolute;
        top: 0;
        color: #5b6274;
        font-size: 9px;
      }
      .seq-cells {
        position: relative;
        height: 20px;
        touch-action: none;
      }
      .seq-cell {
        position: absolute;
        top: 0;
        background: #171b26;
        border-right: 1px solid #0d0f14;
        box-sizing: border-box;
      }
      .seq-cell.epoch {
        border-right: 1px solid #2e3444;
      }
      .seq-cell.on {
        background: #3a6b3a;
      }
      .seq-cell.cursor {
        outline: 1px solid #f2cc4d;
        outline-offset: -1px;
      }

      /* ---- notebook ------------------------------------------------------- */
      /* The verdict tones are the only place colour carries meaning in this
         panel, and they are deliberately far apart: green and amber must never
         be mistaken for each other at a glance, because that mistake IS reading
         a LIKELY as a PROVEN. */
      .nb-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .nb-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #1c2130;
      }
      .nb-coverage {
        color: #9aa2b5;
      }
      .nb-spacer {
        flex: 1;
      }
      .nb-loading,
      .nb-empty {
        padding: 16px;
        color: #6d7486;
      }
      .nb-list {
        flex: 1;
        overflow: auto;
        padding: 4px;
      }

      .nb-row {
        border: 1px solid #1c2130;
        border-radius: 4px;
        padding: 6px 8px;
        margin-bottom: 6px;
        background: #10131a;
      }
      .nb-row-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .nb-claim-text {
        flex: 1;
        word-break: break-word;
      }
      .nb-struck {
        text-decoration: line-through;
        color: #7d8598;
      }
      .nb-verdict {
        flex: none;
        border-radius: 3px;
        padding: 1px 6px;
        font-size: 11px;
        white-space: nowrap;
      }
      .nb-tone-green {
        background: #16311d;
        border: 1px solid #2f7a45;
        color: #7fd79a;
      }
      .nb-tone-amber {
        background: #33280e;
        border: 1px solid #97741f;
        color: #f2cc4d;
      }
      .nb-tone-red {
        background: #351719;
        border: 1px solid #8c3238;
        color: #f08a90;
      }
      .nb-tone-grey {
        background: #171b26;
        border: 1px solid #2e3444;
        color: #9aa2b5;
      }
      .nb-row-meta {
        display: flex;
        gap: 8px;
        margin-top: 3px;
        color: #6d7486;
        font-size: 11px;
      }
      .nb-points {
        color: #7d8598;
      }
      .nb-note {
        margin-top: 4px;
        padding-left: 8px;
        border-left: 2px solid #2e3444;
        color: #9aa2b5;
        font-size: 11px;
      }
      .nb-detail {
        margin-top: 6px;
        padding: 6px;
        background: #0d0f14;
        border-radius: 3px;
        font-size: 11px;
        color: #9aa2b5;
      }
      .nb-witness {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
      }
      .nb-witness-label {
        color: #6d7486;
      }
      .nb-bit {
        color: #f2cc4d;
      }
      .nb-load {
        margin-top: 6px;
      }
      .nb-actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .nb-history {
        margin-top: 6px;
        font-size: 11px;
        color: #6d7486;
      }
      .nb-history-row {
        padding: 2px 0 2px 10px;
      }

      .nb-form {
        border-bottom: 1px solid #1c2130;
        padding: 8px;
        background: #0d0f14;
      }
      .nb-field {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .nb-label {
        flex: none;
        width: 120px;
        text-align: right;
        color: #9aa2b5;
      }
      .nb-input {
        flex: 1;
        min-width: 80px;
      }
      .nb-wide {
        min-width: 200px;
      }
      .nb-hint {
        margin: 4px 0 8px 128px;
        color: #6d7486;
        font-size: 11px;
      }
      .nb-form-footer {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
      }
      .nb-cost {
        flex: 1;
        font-size: 11px;
      }
      .nb-cost-ok {
        color: #7fd79a;
      }
      /* The warning that has to arrive before the verdict, not after it. */
      .nb-cost-sampled {
        color: #f2cc4d;
      }
      .nb-cost-bad {
        color: #f08a90;
      }
      .nb-cost-idle {
        color: #6d7486;
      }
      .nb-section {
        padding: 8px 6px 4px;
        color: #6d7486;
        border-top: 1px solid #1c2130;
      }
      .nb-evidence {
        padding: 0 4px 8px;
      }
      /* Evidence is a measurement, not an assertion: no verdict tone, and a
         left edge that reads as "recorded" rather than "settled". */
      .nb-evidence-row {
        border-left: 2px solid #3a4256;
      }
      .nb-warning {
        color: #f2cc4d;
        border-left-color: #97741f;
      }

      /* ---- experiment runner ----------------------------------------------- */
      .xp-panel,
      .mb-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .xp-toolbar,
      .mb-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #1c2130;
      }
      .xp-params {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 6px 8px 0;
      }
      .xp-inline {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: #9aa2b5;
      }
      .xp-num {
        width: 64px;
        background: #10131a;
        border: 1px solid #262b36;
        border-radius: 3px;
        color: #cfd4de;
        padding: 3px 4px;
      }
      .xp-watch-list {
        flex: 1;
        min-width: 200px;
      }
      .xp-blurb {
        padding: 4px 8px 6px;
        color: #6d7486;
        font-size: 11px;
      }
      .xp-loading,
      .mb-loading {
        padding: 16px;
        color: #6d7486;
      }
      .xp-body {
        flex: 1;
        overflow: auto;
        padding: 0 8px 8px;
      }
      .xp-status,
      .mb-status {
        color: #9aa2b5;
        font-size: 11px;
      }
      .xp-status.bad,
      .mb-status.bad {
        color: #f08a90;
      }
      /* The two self-checks from the sensitivity map. Amber, above the matrix,
         and never collapsed into a console log: a matrix with either problem
         looks exactly as convincing as one without. */
      .xp-warning {
        margin: 6px 0;
        padding: 4px 8px;
        border-left: 2px solid #97741f;
        background: #1c1710;
        color: #f2cc4d;
        font-size: 11px;
      }
      .xp-baseline-note {
        margin: 6px 0;
        color: #6d7486;
        font-size: 11px;
      }
      .xp-readout {
        padding: 4px 0;
        color: #cfd4de;
        font-size: 11px;
      }
      .xp-canvas-wrap {
        overflow: auto;
        max-height: 45%;
        border: 1px solid #1c2130;
        background: #0d0f14;
      }
      .xp-canvas {
        display: block;
        cursor: crosshair;
      }
      .xp-summary {
        margin-top: 8px;
      }
      .xp-summary-note {
        color: #6d7486;
        font-size: 11px;
      }
      .xp-table-row {
        display: flex;
        gap: 8px;
        padding: 1px 0;
        font-size: 11px;
      }
      .xp-table-row .net-chip {
        flex: none;
        width: 120px;
      }
      .xp-hits {
        color: #9aa2b5;
        word-break: break-word;
      }
      .xp-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      .xp-evidence-note {
        color: #6d7486;
        font-size: 11px;
      }

      /* ---- model builder ----------------------------------------------------- */
      .mb-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: auto;
        padding: 8px;
        gap: 8px;
      }
      .mb-source {
        min-height: 180px;
        flex: 1 1 auto;
        resize: vertical;
        background: #0d0f14;
        color: #cfd4de;
        border: 1px solid #262b36;
        border-radius: 3px;
        padding: 8px;
        font: inherit;
        tab-size: 2;
      }
      .mb-badge-line {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .mb-points {
        color: #7d8598;
        font-size: 11px;
      }
      .mb-badge-detail {
        margin-top: 3px;
        color: #6d7486;
        font-size: 11px;
      }
      .mb-summary {
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      .mb-agreement {
        color: #cfd4de;
      }
      .mb-watch,
      .mb-pulses {
        color: #6d7486;
        font-size: 11px;
      }
      /* The panel's whole point: not "wrong", but wrong HERE, on this vector,
         about this signal, one click from the waveform. */
      .mb-divergence {
        margin-top: 6px;
        padding: 8px;
        border: 1px solid #8c3238;
        border-radius: 3px;
        background: #180f11;
        color: #f0b6ba;
        font-size: 11px;
      }
      .mb-divergence-head {
        color: #f08a90;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .mb-agreed {
        margin-top: 6px;
        color: #f2cc4d;
        font-size: 11px;
      }
      /* "Nothing was tested" has to read as a warning, not as a pass. */
      .mb-vacuous {
        margin-top: 6px;
        padding: 4px 8px;
        border-left: 2px solid #97741f;
        background: #1c1710;
        color: #f2cc4d;
        font-size: 11px;
      }
      .mb-mismatches {
        margin-top: 6px;
        color: #9aa2b5;
        font-size: 11px;
      }
      .mb-error {
        padding: 8px;
        border-left: 2px solid #8c3238;
        color: #f08a90;
        white-space: pre-wrap;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="workspace"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
